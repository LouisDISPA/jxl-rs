name: CodSpeed

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: codspeed-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  benchmarks:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: CPU simulation
            mode: simulation
            runner: ubuntu-latest
            build_args: >-
              -p jxl_cli -p jxl -p jxl_transforms --bench codspeed
              --features jxl/benchmark,jxl_transforms/all-simd
            run_args: --bench codspeed
            filter: green_queen|bike_u8|newtons_cradle_u8|dct_|xyb_|epf1_|default_320x320|above_4096px
            exclude_allocations: true
          - name: Memory
            mode: memory
            runner: ubuntu-latest
            build_args: -p jxl_cli --bench codspeed
            run_args: -p jxl_cli --bench codspeed
            filter: green_queen|bike_u8|newtons_cradle_u8
            exclude_allocations: false
    steps:
      - name: Checkout the source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          prefix-key: codspeed-${{ matrix.mode }}-${{ runner.arch }}

      - name: Install cargo-codspeed
        uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2.85.3
        with:
          tool: cargo-codspeed

      - name: Build benchmarks
        run: >-
          cargo codspeed build --locked -m ${{ matrix.mode }}
          ${{ matrix.build_args }}

      - name: Run benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: ${{ matrix.mode }}
          exclude-allocations: ${{ matrix.exclude_allocations }}
          run: >-
            cargo codspeed run ${{ matrix.run_args }} -- '${{ matrix.filter }}'
